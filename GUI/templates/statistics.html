<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="refresh" content="5">
</head>
<body style="background:#f0a8c8; text-align:center; font-family:Arial; padding:40px;">

  <h1>STATISTICS</h1>

  <table border="1" style="margin:0 auto;">
    <tr>
      <th>Ranking</th>
      <th>Water usage</th>
      <th>Temperature</th>
      <th>Cost</th>
    </tr>
    {% for s in sessions %}
    <tr>
      <td>{{ loop.index }}: {{ s.user }}</td>
      <td>{{ s.water }} L</td>
      <td>{{ s.temp }} C</td>
      <td>{{ s.cost }} kr</td>
    </tr>
    {% endfor %}
  </table>

  <br>
  <a href="/">BACK</a>

</body>
</html>
